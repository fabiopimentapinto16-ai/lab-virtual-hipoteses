name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Testes de domínio e exportação
        run: npm test
      - name: Tipos e build
        run: npm run build
      - name: Conferir IDs PubChem das fichas
        run: npm run verificar-ids
      - name: Exemplo reproduzível confere com o gerado
        run: |
          cp exemplos/HYP-2026-001.json /tmp/antes.json
          npm run gerar-exemplo
          diff /tmp/antes.json exemplos/HYP-2026-001.json
      - name: E2E (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 &
          sleep 4
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-capturas, path: e2e/saida }
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }
